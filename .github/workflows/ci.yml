name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update golden files
        run: flutter test --update-goldens test/design_system_golden_test.dart

      - name: Commit updated goldens
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add test/goldens/
          git diff --cached --quiet || git commit -m "chore: update golden files [skip ci]" && git push origin HEAD

      - name: flutter test
        run: flutter test
