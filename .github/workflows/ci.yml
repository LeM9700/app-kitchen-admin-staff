name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"
  # Production backend for the Netlify web deploy. Not a secret (it's the
  # public API host) -- kept as a workflow env var rather than a repo
  # secret so it's visible/updatable without touching secret storage.
  WEB_API_BASE_URL: "https://api-kitchen-production.up.railway.app/api/v1"

jobs:
  test:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        # --no-fatal-infos: this Flutter version treats info-level lints as
        # fatal by default, and the repo currently carries ~243 pre-existing
        # info-only issues (trailing commas, deprecated API hints, etc.)
        # unrelated to any given change. Warnings/errors stay fatal.
        run: flutter analyze --no-fatal-infos

      - name: Update golden files
        run: flutter test --update-goldens test/design_system_golden_test.dart

      - name: Commit updated goldens
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add test/goldens/
          git diff --cached --quiet || git commit -m "chore: update golden files [skip ci]" && git push origin HEAD

      - name: flutter test
        run: flutter test

  deploy-web:
    name: Deploy web to Netlify
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on a real push to main once format/analyze/test all
    # passed above — never from a pull_request run, and never if `test`
    # failed or was skipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (release)
        # Without these, Env.apiBaseUrl defaults to http://127.0.0.1:8000
        # (see lib/core/config/env.dart) -- unreachable from the deployed
        # site, and http:// from an https:// page is blocked as mixed
        # content by the browser. The WebSocket URL derives from
        # API_BASE_URL automatically (see websocket_client.dart), so no
        # separate define is needed for it.
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=${{ env.WEB_API_BASE_URL }}

      - name: Check Netlify secrets
        # nwtgck/actions-netlify silently no-ops (exits 0, job stays green)
        # when credentials are missing instead of failing — fail loudly here
        # instead, so a misconfigured/missing secret is never mistaken for a
        # real deploy again.
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN_KITCHEN }}" ] || [ -z "${{ secrets.NETLIFY_SITE_ID_KITCHEN }}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN_KITCHEN and/or NETLIFY_SITE_ID_KITCHEN repo secrets are not set — deploy would silently no-op. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: build/web
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }} via GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_KITCHEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_KITCHEN }}
        timeout-minutes: 5
